<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Kikoba - Kikoba App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg,#198754 0%,#0d6efd 100%); min-height:100vh; display:flex; align-items:center; }
        .card { border:none; border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,0.2); }
        .card-header { background:linear-gradient(135deg,#198754,#0d6efd); border-radius:16px 16px 0 0 !important; }
        .btn-primary { background:#198754; border-color:#198754; }
        .btn-primary:hover { background:#157347; border-color:#157347; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card">
                <div class="card-header text-center py-4">
                    <i class="fas fa-users fa-2x text-white mb-2"></i>
                    <h4 class="text-white fw-bold mb-0">Create Your Kikoba</h4>
                    <small class="text-white opacity-75">Set up your savings group</small>
                </div>
                <div class="card-body p-4">
                    {% if error %}
                    <div class="alert alert-danger py-2">
                        <i class="fas fa-exclamation-circle me-1"></i> {{ error }}
                    </div>
                    {% endif %}

                    <form method="POST" action="/create-group">
                        <div class="mb-4">
                            <label class="form-label fw-bold">Kikoba Name <span class="text-danger">*</span></label>
                            <input type="text" name="group_name" class="form-control form-control-lg"
                                   placeholder="e.g. Huduma Family" required autofocus>
                            <small class="text-muted">This is the name your members will see.</small>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 btn-lg fw-bold">
                            <i class="fas fa-plus-circle me-1"></i> Create Kikoba
                        </button>
                    </form>

                    <div class="alert alert-info mt-3 mb-0 py-2">
                        <small>
                            <i class="fas fa-info-circle me-1"></i>
                            After creating, you'll see your <strong>Group ID</strong> on the dashboard.
                            Share it with your members so they can log in.
                        </small>
                    </div>
                </div>
                <div class="card-footer text-center bg-transparent border-0 pb-3">
                    <small class="text-muted">
                        <a href="/logout" class="text-decoration-none">
                            <i class="fas fa-arrow-left me-1"></i> Logout
                        </a>
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
