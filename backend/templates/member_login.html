<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Member Login - Kikoba Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; }
        .card { border: none; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .card-header { background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 16px 16px 0 0 !important; }
        .toggle-pw { cursor: pointer; background: none; border: 1px solid #ced4da; border-left: none; color: #6c757d; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card">
                <div class="card-header text-center py-4">
                    <i class="fas fa-users fa-2x text-white mb-2"></i>
                    <h4 class="text-white fw-bold mb-0">Member Login</h4>
                    <small class="text-white opacity-75">Kikoba Manager</small>
                </div>
                <div class="card-body p-4">
                    {% if error %}
                    <div class="alert alert-danger py-2">
                        <i class="fas fa-exclamation-circle me-1"></i> {{ error }}
                    </div>
                    {% endif %}

                    <form method="POST" action="/member-login">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Group ID <span class="text-danger">*</span></label>
                            <input type="number" name="group_code" class="form-control"
                                   placeholder="Enter your Group ID" required autofocus>
                            <small class="text-muted">Ask your admin for the Group ID.</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Phone Number <span class="text-danger">*</span></label>
                            <input type="text" name="phone" class="form-control"
                                   placeholder="e.g. 0712345678" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input type="password" name="password" id="pw"
                                       class="form-control" placeholder="Your password" required>
                                <button class="toggle-pw btn" type="button" onclick="togglePw('pw','eyePw')">
                                    <i class="fas fa-eye" id="eyePw"></i>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold btn-lg">
                            <i class="fas fa-sign-in-alt me-1"></i> Login
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <small class="text-muted">Group admin?
                            <a href="/login" class="text-decoration-none">Admin Login →</a>
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
function togglePw(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon  = document.getElementById(iconId);
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
    }
}
</script>
</body>
</html>
