{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0">
            <div class="card-header text-center py-4" style="background:linear-gradient(135deg,#667eea,#764ba2)">
                <i class="fas fa-users fa-2x text-white mb-2"></i>
                <h4 class="text-white mb-0 fw-bold">Member Login</h4>
                <small class="text-white opacity-75">Kikoba Manager</small>
            </div>
            <div class="card-body p-4">
                {% if error %}
                <div class="alert alert-danger py-2">
                    <i class="fas fa-exclamation-circle me-1"></i> {{ error }}
                </div>
                {% endif %}

                <form method="POST" action="/member-login">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Group Code</label>
                        <input type="number" name="group_code" class="form-control" 
                               placeholder="Enter your group code" required>
                        <small class="text-muted">Ask your admin for the group code</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Phone Number</label>
                        <input type="text" name="phone" class="form-control"
                               placeholder="e.g. 0712345678" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Password</label>
                        <input type="password" name="password" class="form-control"
                               placeholder="Your password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold">
                        <i class="fas fa-sign-in-alt me-1"></i> Login
                    </button>
                </form>

                <div class="text-center mt-3">
                    <small class="text-muted">Group admin? 
                        <a href="/login" class="text-decoration-none">Admin Login →</a>
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
