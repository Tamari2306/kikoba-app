<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Account - Kikoba App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body{background:linear-gradient(135deg,#198754 0%,#0d6efd 100%);min-height:100vh;display:flex;align-items:center;}
        .card{border:none;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.22);}
        .card-header{background:linear-gradient(135deg,#198754 0%,#0d6efd 100%);border-radius:16px 16px 0 0!important;}
        .btn-primary{background:#198754;border-color:#198754;}
        .btn-primary:hover{background:#157347;border-color:#157347;}
        .toggle-pw{border:1px solid #ced4da;border-left:none;background:#fff;color:#6c757d;}
    </style>
</head>
<body>
<div class="container py-4">
<div class="row justify-content-center">
<div class="col-md-5 col-lg-4">
    <div class="card">
        <div class="card-header text-center py-4">
            <i class="fas fa-user-plus fa-2x text-white mb-2 d-block"></i>
            <h4 class="text-white fw-bold mb-0">Create Account</h4>
            <small class="text-white opacity-75">Kikoba App — New Admin</small>
        </div>
        <div class="card-body p-4">
            {%- if error %}
            <div class="alert alert-danger py-2 mb-3">
                <i class="fas fa-exclamation-circle me-1"></i> {{ error }}
            </div>
            {%- endif %}
            <form method="POST" action="/signup">
                <div class="mb-3">
                    <label class="form-label fw-bold">Full Name <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control"
                           placeholder="Your full name" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Phone Number <span class="text-danger">*</span></label>
                    <input type="tel" name="phone" class="form-control"
                           placeholder="e.g. 0712345678" required>
                    <small class="text-muted">Used to log in.</small>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Email</label>
                    <input type="email" name="email" class="form-control"
                           placeholder="your@email.com (optional)">
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Password <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <input type="password" name="password" id="pw"
                               class="form-control" placeholder="Min. 6 characters" required>
                        <button class="toggle-pw btn" type="button" onclick="
                            const p=document.getElementById('pw'),
                                  i=this.querySelector('i');
                            p.type=p.type==='password'?'text':'password';
                            i.classList.toggle('fa-eye');
                            i.classList.toggle('fa-eye-slash');">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold btn-lg">
                    <i class="fas fa-user-plus me-1"></i> Create Account
                </button>
            </form>
            <div class="text-center mt-3">
                <small class="text-muted">Already have an account?
                    <a href="/login" class="text-decoration-none" style="color:#198754">
                        Login →
                    </a>
                </small>
            </div>
        </div>
    </div>
</div>
</div>
</div>
</body>
</html>
