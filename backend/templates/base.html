<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <title>{% block title %}Kikoba App{% endblock %}</title>

    <link rel="icon" type="image/png" href="/static/icons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg" />
    <link rel="shortcut icon" href="/static/icons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Kikoba Smart" />
    <link rel="manifest" href="/static/icons/site.webmanifest" />

    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <!-- Mobile-specific optimizations -->
    <style>
        /* Prevent zoom on input focus (iOS) */
        input, select, textarea {
            font-size: 16px !important;
        }
        
        /* Prevent horizontal scroll */
        html, body {
            max-width: 100%;
            overflow-x: hidden;
        }
        
        /* Mobile-friendly tables */
        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        /* Better mobile spacing */
        @media (max-width: 768px) {
            .container-fluid {
                padding-left: 10px;
                padding-right: 10px;
            }
            
            /* Stack dashboard cards on mobile */
            .row.g-3 > [class*="col-"] {
                margin-bottom: 15px;
            }
            
            /* Make buttons full-width on mobile */
            .btn-group-mobile {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            
            .btn-group-mobile .btn {
                width: 100%;
            }
            
            /* Smaller cards on mobile */
            .card-body {
                padding: 1rem;
            }
            
            .card-body h3, .card-body h4 {
                font-size: 1.25rem;
            }
            
            /* Responsive modal */
            .modal-xl {
                margin: 0.5rem;
            }
        }
        
        /* Responsive tables */
        @media (max-width: 992px) {
            table {
                font-size: 0.875rem;
            }
            
            table th, table td {
                padding: 0.5rem;
            }
        }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/dashboard">
                <i class="bi bi-piggy-bank-fill"></i> Kikoba App
            </a>
            
            <!-- Mobile toggle button -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/members-page">
                            <i class="bi bi-people-fill"></i> Members
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/contributions-page">
                            <i class="bi bi-wallet2"></i> Contributions
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/loans-page">
                            <i class="bi bi-cash-stack"></i> Loans
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/penalties-page">
                            <i class="bi bi-exclamation-triangle-fill"></i> Penalties
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/profits-page">
                            <i class="bi bi-graph-up-arrow"></i> Profits
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/reports-page">
                            <i class="bi bi-file-earmark-text"></i> Reports
                        </a>
                    </li>
                </ul>
                
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/logout">
                            <i class="bi bi-box-arrow-right"></i> Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <!-- Main Content -->
    <div class="container-fluid">
        {% block content %}{% endblock %}
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("{{ url_for('static', filename='service-worker.js') }}")
                .then(reg => console.log("Service Worker Registered"))
                .catch(err => console.log("SW registration failed:", err));
            });
        }
    </script>


    
    {% block extra_js %}{% endblock %}
</body>
</html>
