{% extends "base.html" %}
{% block content %}

<!-- Manage Member Modal -->
<div class="modal fade" id="manageMemberModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title">
                    <i class="fas fa-user-cog me-2"></i>Manage Member
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="mgMemberId">
                <div class="mb-2">
                    <label class="form-label fw-bold">Member</label>
                    <input type="text" class="form-control" id="mgMemberName" disabled>
                </div>

                <!-- Role Assignment -->
                <div class="mb-3 border rounded p-3">
                    <label class="form-label fw-bold">Assign Role</label>
                    <select class="form-select" id="mgRole">
                        <option value="member">Member (read-only)</option>
                        <option value="treasurer">Treasurer (can record transactions)</option>
                        <option value="admin">Admin (full access)</option>
                    </select>
                    <button class="btn btn-success w-100 mt-2" onclick="saveRole()">
                        <i class="fas fa-save me-1"></i> Save Role
                    </button>
                </div>

                <!-- Set/Reset Password + Login Access -->
                <div class="mb-3 border rounded p-3">
                    <label class="form-label fw-bold">Set Login Access</label>
                    <div class="mb-2">
                        <label class="form-label small text-muted">Email (optional — for login too)</label>
                        <input type="email" class="form-control" id="mgEmail"
                               placeholder="member@email.com">
                    </div>
                    <div class="mb-2">
                        <label class="form-label small text-muted">Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="mgPassword"
                                   placeholder="New password (min 6 chars)">
                            <button class="btn btn-outline-secondary" type="button"
                                    onclick="toggleMgPw()">
                                <i class="fas fa-eye" id="mgEye"></i>
                            </button>
                        </div>
                    </div>
                    <button class="btn btn-warning w-100 mt-2" onclick="savePassword()">
                        <i class="fas fa-key me-1"></i> Set Login Access
                    </button>
                    <small class="text-muted d-block mt-1">
                        Member can log in with phone{{" or email" if provided}} + this password.
                    </small>
                </div>

                <!-- Activate / Deactivate -->
                <div class="border rounded p-3">
                    <label class="form-label fw-bold">Account Status</label>
                    <div class="d-flex gap-2">
                        <button class="btn btn-outline-success flex-fill" onclick="setActive(1)">
                            <i class="fas fa-check me-1"></i> Activate
                        </button>
                        <button class="btn btn-outline-danger flex-fill" onclick="setActive(0)">
                            <i class="fas fa-ban me-1"></i> Deactivate
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Add Member Modal -->
<div class="modal fade" id="addMemberModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title"><i class="fas fa-user-plus me-2"></i>Add Member</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addMemberForm">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Full Name <span class="text-danger">*</span></label>
                        <input type="text" id="newName" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Phone</label>
                        <input type="tel" id="newPhone" class="form-control" placeholder="0712345678">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Joined Date</label>
                        <input type="date" id="newDate" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-success w-100">
                        <i class="fas fa-plus me-1"></i> Add Member
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Edit Member Modal -->
<div class="modal fade" id="editMemberModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-warning text-dark">
                <h5 class="modal-title"><i class="fas fa-edit me-2"></i>Edit Member</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="editMemberForm">
                    <input type="hidden" id="editMemberId">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Full Name</label>
                        <input type="text" id="editName" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Phone</label>
                        <input type="tel" id="editPhone" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-warning w-100">
                        <i class="fas fa-save me-1"></i> Save Changes
                    </button>
                </form>
                <button class="btn btn-danger w-100 mt-2" id="deleteMemberBtn">
                    <i class="fas fa-trash me-1"></i> Delete Member
                </button>
            </div>
        </div>
    </div>
</div>

<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="fw-bold"><i class="fas fa-users me-2 text-success"></i>Members</h1>
    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addMemberModal">
        <i class="fas fa-user-plus me-1"></i> Add Member
    </button>
</div>

<!-- Summary -->
<div class="row g-3 mb-4" id="summaryRow"></div>

<!-- Table -->
<div class="card shadow-sm border-0">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0" id="membersTable">
                <thead class="table-success">
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Joined</th>
                        <th>Role</th>
                        <th class="text-end">Savings</th>
                        <th class="text-end">HISA Units</th>
                        <th class="text-end">Loans</th>
                        <th class="text-end">Penalties</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
function fc(n){const v=parseFloat(n);return isNaN(v)?'0 TZS':v.toLocaleString('en-TZ',{maximumFractionDigits:0})+' TZS';}

const roleColor  = {admin:'danger', treasurer:'warning', member:'secondary'};
const roleLabel  = {admin:'Admin', treasurer:'Treasurer', member:'Member'};

let allMembers = [];

async function loadMembers() {
    const res = await fetch('/api/members');
    if (!res.ok) return;
    allMembers = await res.json();
    renderTable(allMembers);
    renderSummary(allMembers);
}

function renderSummary(members) {
    const totalSavings  = members.reduce((s,m) => s + parseFloat(m.total_contributions||0), 0);
    const totalLoans    = members.reduce((s,m) => s + parseFloat(m.total_outstanding||0), 0);
    const totalPenalties= members.reduce((s,m) => s + parseFloat(m.total_penalties||0), 0);
    document.getElementById('summaryRow').innerHTML = `
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm text-center p-3">
                <div class="text-muted small">Total Members</div>
                <div class="fw-bold fs-4 text-success">${members.length}</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm text-center p-3">
                <div class="text-muted small">Total Savings</div>
                <div class="fw-bold fs-5 text-success">${fc(totalSavings)}</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm text-center p-3">
                <div class="text-muted small">Total Loans Due</div>
                <div class="fw-bold fs-5 text-danger">${fc(totalLoans)}</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm text-center p-3">
                <div class="text-muted small">Total Penalties Due</div>
                <div class="fw-bold fs-5 text-warning">${fc(totalPenalties)}</div>
            </div>
        </div>`;
}

function renderTable(members) {
    const tbody = document.querySelector('#membersTable tbody');
    tbody.innerHTML = members.map((m, i) => `
        <tr>
            <td>${i+1}</td>
            <td>
                <a href="/member-details/${m.id}" class="fw-bold text-decoration-none text-dark">
                    ${m.name}
                </a>
                ${m.is_active === 0 ? '<span class="badge bg-danger ms-1">Inactive</span>' : ''}
            </td>
            <td>${m.phone || '—'}</td>
            <td>${m.joined_date || '—'}</td>
            <td>
                <span class="badge bg-${roleColor[m.role]||'secondary'}">
                    ${roleLabel[m.role]||'Member'}
                </span>
            </td>
            <td class="text-end text-success">${fc(m.total_contributions)}</td>
            <td class="text-end text-primary">${(parseFloat(m.hisa_units)||0).toFixed(2)}</td>
            <td class="text-end ${parseFloat(m.total_outstanding)>0?'text-danger':'text-success'}">
                ${fc(m.total_outstanding)}
            </td>
            <td class="text-end ${parseFloat(m.total_penalties)>0?'text-warning':'text-muted'}">
                ${fc(m.total_penalties)}
            </td>
            <td class="text-center">
                <button class="btn btn-sm btn-outline-success me-1"
                        title="Manage role & password"
                        onclick="openManage(${m.id},'${m.name.replace(/'/g,"\\'")}','${m.role||'member'}','${(m.email||'').replace(/'/g,"\\'")}')">
                    <i class="fas fa-user-cog"></i>
                </button>
                <button class="btn btn-sm btn-outline-warning me-1"
                        title="Edit name/phone"
                        onclick="openEdit(${m.id},'${m.name.replace(/'/g,"\\'")}','${m.phone||''}')">
                    <i class="fas fa-edit"></i>
                </button>
                <a class="btn btn-sm btn-outline-info"
                   href="/member-details/${m.id}" title="View details">
                    <i class="fas fa-eye"></i>
                </a>
            </td>
        </tr>`).join('');
}

// ── Manage Modal ──────────────────────────────────────────────────────
function openManage(id, name, role, email) {
    document.getElementById('mgMemberId').value   = id;
    document.getElementById('mgMemberName').value = name;
    document.getElementById('mgRole').value        = role;
    document.getElementById('mgEmail').value       = email || '';
    document.getElementById('mgPassword').value    = '';
    new bootstrap.Modal(document.getElementById('manageMemberModal')).show();
}

function toggleMgPw() {
    const pw   = document.getElementById('mgPassword');
    const icon = document.getElementById('mgEye');
    pw.type = pw.type === 'password' ? 'text' : 'password';
    icon.classList.toggle('fa-eye');
    icon.classList.toggle('fa-eye-slash');
}

async function saveRole() {
    const id   = document.getElementById('mgMemberId').value;
    const role = document.getElementById('mgRole').value;
    const res  = await fetch('/api/member/set-role', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({member_id: id, role})
    });
    const data = await res.json();
    if (res.ok) {
        bootstrap.Modal.getInstance(document.getElementById('manageMemberModal')).hide();
        alert(data.message || 'Role updated.');
        loadMembers();
    } else {
        alert(data.error || 'Failed to update role.');
    }
}

async function savePassword() {
    const id       = document.getElementById('mgMemberId').value;
    const role     = document.getElementById('mgRole').value;
    const email    = document.getElementById('mgEmail').value.trim();
    const password = document.getElementById('mgPassword').value.trim();
    if (!password || password.length < 6) {
        return alert('Password must be at least 6 characters.');
    }
    const res = await fetch('/api/member/set-password', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({member_id: id, password, role, email})
    });
    const data = await res.json();
    if (res.ok) {
        bootstrap.Modal.getInstance(document.getElementById('manageMemberModal')).hide();
        alert(data.message || 'Password updated.');
        loadMembers();
    } else {
        alert(data.error || 'Failed to update password.');
    }
}

async function setActive(is_active) {
    const id = document.getElementById('mgMemberId').value;
    if (!confirm(`${is_active ? 'Activate' : 'Deactivate'} this member?`)) return;
    const res = await fetch('/api/member/toggle-active', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({member_id: id, is_active})
    });
    const data = await res.json();
    if (res.ok) {
        bootstrap.Modal.getInstance(document.getElementById('manageMemberModal')).hide();
        alert(data.message || 'Status updated.');
        loadMembers();
    } else {
        alert(data.error || 'Failed.');
    }
}

// ── Add Member ────────────────────────────────────────────────────────
document.getElementById('addMemberForm').addEventListener('submit', async e => {
    e.preventDefault();
    const res = await fetch('/api/members', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
            name:        document.getElementById('newName').value,
            phone:       document.getElementById('newPhone').value,
            joined_date: document.getElementById('newDate').value,
        })
    });
    const data = await res.json();
    if (res.ok) {
        bootstrap.Modal.getInstance(document.getElementById('addMemberModal')).hide();
        document.getElementById('addMemberForm').reset();
        loadMembers();
    } else {
        alert(data.error || 'Failed to add member.');
    }
});

// ── Edit Member ───────────────────────────────────────────────────────
function openEdit(id, name, phone) {
    document.getElementById('editMemberId').value = id;
    document.getElementById('editName').value     = name;
    document.getElementById('editPhone').value    = phone;
    new bootstrap.Modal(document.getElementById('editMemberModal')).show();
}

document.getElementById('editMemberForm').addEventListener('submit', async e => {
    e.preventDefault();
    const id = document.getElementById('editMemberId').value;
    const res = await fetch(`/api/members/${id}`, {
        method: 'PUT',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
            name:  document.getElementById('editName').value,
            phone: document.getElementById('editPhone').value,
        })
    });
    const data = await res.json();
    if (res.ok) {
        bootstrap.Modal.getInstance(document.getElementById('editMemberModal')).hide();
        loadMembers();
    } else {
        alert(data.error || 'Failed to update member.');
    }
});

document.getElementById('deleteMemberBtn').addEventListener('click', async () => {
    const id   = document.getElementById('editMemberId').value;
    const name = document.getElementById('editName').value;
    if (!confirm(`Delete ${name}? This cannot be undone.`)) return;
    const res = await fetch(`/api/members/${id}`, { method: 'DELETE' });
    const data = await res.json();
    if (res.ok) {
        bootstrap.Modal.getInstance(document.getElementById('editMemberModal')).hide();
        loadMembers();
    } else {
        alert(data.error || 'Failed to delete member.');
    }
});

loadMembers();
</script>
{% endblock %}
