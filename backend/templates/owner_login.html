<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Owner Access - Kikoba App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body{background:linear-gradient(135deg,#0d1117 0%,#198754 100%);min-height:100vh;display:flex;align-items:center;}
        .card{border:none;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,0.4);}
        .card-header{background:linear-gradient(135deg,#0d1117,#198754);border-radius:16px 16px 0 0!important;}
        .toggle-pw{border:1px solid #ced4da;border-left:none;background:white;color:#6c757d;}
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card">
                <div class="card-header text-center py-4">
                    <i class="fas fa-shield-alt fa-2x text-white mb-2"></i>
                    <h4 class="text-white fw-bold mb-0">Owner Access</h4>
                    <small class="text-white opacity-75">Kikoba App Platform</small>
                </div>
                <div class="card-body p-4">
                    {% if error %}
                    <div class="alert alert-danger py-2">
                        <i class="fas fa-exclamation-circle me-1"></i> {{ error }}
                    </div>
                    {% endif %}
                    <form method="POST" action="/owner/login">
                        <div class="mb-4">
                            <label class="form-label fw-bold">Access Token</label>
                            <div class="input-group">
                                <input type="password" name="token" id="token"
                                       class="form-control" placeholder="Enter owner token" required autofocus>
                                <button class="toggle-pw btn" type="button" onclick="
                                    const i=document.getElementById('token');
                                    const e=this.querySelector('i');
                                    i.type=i.type==='password'?'text':'password';
                                    e.classList.toggle('fa-eye');e.classList.toggle('fa-eye-slash');">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success w-100 fw-bold btn-lg">
                            <i class="fas fa-unlock me-1"></i> Access Dashboard
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
