<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Kikoba App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body{background:linear-gradient(135deg,#198754 0%,#0d6efd 100%);min-height:100vh;display:flex;align-items:center;}
        .card{border:none;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,0.2);}
        .card-header{background:linear-gradient(135deg,#198754,#0d6efd);border-radius:16px 16px 0 0!important;}
        .btn-primary{background:#198754;border-color:#198754;}
        .btn-primary:hover{background:#157347;border-color:#157347;}
        .btn-outline-success{border-color:#198754;color:#198754;}
        .btn-outline-success:hover,.btn-outline-success.active{background:#198754;color:#fff;border-color:#198754;}
        .toggle-pw{border:1px solid #ced4da;border-left:none;background:white;color:#6c757d;}
        .spinner-border{width:1.1rem;height:1.1rem;}
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card">
                <div class="card-header text-center py-4">
                    <i class="fas fa-leaf fa-2x text-white mb-2"></i>
                    <h4 class="text-white fw-bold mb-0">Kikoba App</h4>
                    <small class="text-white opacity-75">Sign in to your group</small>
                </div>
                <div class="card-body p-4">

                    <div id="errorAlert" class="alert alert-danger py-2 d-none"></div>
                    <div id="successAlert" class="alert alert-success py-2 d-none"></div>

                    <!-- Group picker shown after Supabase login if multiple groups -->
                    <div id="groupPicker" class="d-none">
                        <p class="text-muted small mb-3">You belong to multiple Vikoba. Choose one to continue:</p>
                        <div id="groupList"></div>
                        <hr>
                        <button class="btn btn-sm btn-outline-secondary w-100" onclick="showLoginForm()">
                            <i class="fas fa-arrow-left me-1"></i> Back
                        </button>
                    </div>

                    <!-- Login form -->
                    <div id="loginForm">
                        <!-- Toggle: Supabase JS vs Classic form -->
                        <div class="btn-group w-100 mb-3" role="group">
                            <button type="button" class="btn btn-outline-success active" id="btnClassic"
                                    onclick="switchMode('classic')">
                                <i class="fas fa-key me-1"></i> Password Login
                            </button>
                            <button type="button" class="btn btn-outline-success" id="btnSupabase"
                                    onclick="switchMode('supabase')">
                                <i class="fas fa-bolt me-1"></i> Quick Login
                            </button>
                        </div>

                        <!-- Classic login (phone + group ID + password → Flask session) -->
                        <form id="classicForm" method="POST" action="/login">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Group ID <span class="text-danger">*</span></label>
                                <input type="number" name="group_code" class="form-control"
                                       placeholder="Enter your Group ID" required>
                                <small class="text-muted">Shown on dashboard after Kikoba creation.</small>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Phone Number <span class="text-danger">*</span></label>
                                <input type="tel" name="phone" class="form-control"
                                       placeholder="e.g. 0712345678" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Password <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <input type="password" name="password" id="pw1" class="form-control"
                                           placeholder="Your password" required>
                                    <button class="toggle-pw btn" type="button"
                                            onclick="togglePw('pw1','eye1')">
                                        <i class="fas fa-eye" id="eye1"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="text-end mb-3">
                                <a href="/forgot-password" class="small text-decoration-none" style="color:#198754">
                                    Forgot password?
                                </a>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-bold btn-lg">
                                <i class="fas fa-sign-in-alt me-1"></i> Login
                            </button>
                        </form>

                        <!-- Supabase JS login (phone or email, no group ID needed) -->
                        <div id="supabaseForm" class="d-none">
                            <div class="btn-group w-100 mb-3">
                                <button class="btn btn-outline-success active" id="btnPhone"
                                        onclick="switchIdentifier('phone')">
                                    <i class="fas fa-phone me-1"></i> Phone
                                </button>
                                <button class="btn btn-outline-success" id="btnEmail"
                                        onclick="switchIdentifier('email')">
                                    <i class="fas fa-envelope me-1"></i> Email
                                </button>
                            </div>
                            <div class="mb-3" id="sbPhoneGroup">
                                <label class="form-label fw-bold">Phone Number</label>
                                <input type="tel" id="sbPhone" class="form-control"
                                       placeholder="+255712345678">
                                <small class="text-muted">Include country code (+255)</small>
                            </div>
                            <div class="mb-3 d-none" id="sbEmailGroup">
                                <label class="form-label fw-bold">Email Address</label>
                                <input type="email" id="sbEmail" class="form-control"
                                       placeholder="your@email.com">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Password</label>
                                <div class="input-group">
                                    <input type="password" id="sbPassword" class="form-control"
                                           placeholder="Your password">
                                    <button class="toggle-pw btn" type="button"
                                            onclick="togglePw('sbPassword','eye2')">
                                        <i class="fas fa-eye" id="eye2"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="text-end mb-3">
                                <a href="/forgot-password" class="small text-decoration-none" style="color:#198754">
                                    Forgot password?
                                </a>
                            </div>
                            <button class="btn btn-primary w-100 fw-bold btn-lg" id="sbLoginBtn"
                                    onclick="handleSupabaseLogin()">
                                <i class="fas fa-sign-in-alt me-1"></i> Login
                            </button>
                        </div>
                    </div>

                    <div class="text-center mt-3">
                        <small class="text-muted">New admin?
                            <a href="/signup" class="text-decoration-none" style="color:#198754">
                                Create account →
                            </a>
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL  = "{{ supabase_url }}";
const SUPABASE_ANON = "{{ supabase_anon }}";
const sbAvailable   = SUPABASE_URL && SUPABASE_ANON && SUPABASE_URL !== 'None';

let sb = null;
if (sbAvailable) {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
}

let loginMode     = 'classic';
let identifierMode = 'phone';

function showError(msg) {
    const el = document.getElementById('errorAlert');
    el.textContent = msg;
    el.classList.remove('d-none');
    document.getElementById('successAlert').classList.add('d-none');
}
function showSuccess(msg) {
    const el = document.getElementById('successAlert');
    el.textContent = msg;
    el.classList.remove('d-none');
    document.getElementById('errorAlert').classList.add('d-none');
}
function clearAlerts() {
    document.getElementById('errorAlert').classList.add('d-none');
    document.getElementById('successAlert').classList.add('d-none');
}

function togglePw(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon  = document.getElementById(iconId);
    input.type  = input.type === 'password' ? 'text' : 'password';
    icon.classList.toggle('fa-eye');
    icon.classList.toggle('fa-eye-slash');
}

function switchMode(mode) {
    loginMode = mode;
    document.getElementById('classicForm').classList.toggle('d-none', mode !== 'classic');
    document.getElementById('supabaseForm').classList.toggle('d-none', mode !== 'supabase');
    document.getElementById('btnClassic').classList.toggle('active', mode === 'classic');
    document.getElementById('btnSupabase').classList.toggle('active', mode === 'supabase');
    clearAlerts();
}

function switchIdentifier(mode) {
    identifierMode = mode;
    document.getElementById('sbPhoneGroup').classList.toggle('d-none', mode !== 'phone');
    document.getElementById('sbEmailGroup').classList.toggle('d-none', mode !== 'email');
    document.getElementById('btnPhone').classList.toggle('active', mode === 'phone');
    document.getElementById('btnEmail').classList.toggle('active', mode === 'email');
}

function showLoginForm() {
    document.getElementById('groupPicker').classList.add('d-none');
    document.getElementById('loginForm').classList.remove('d-none');
}

function redirectByRole(role) {
    if (role === 'admin' || role === 'treasurer') {
        window.location.href = '/dashboard';
    } else {
        window.location.href = '/member-portal';
    }
}

function showGroupPicker(memberships) {
    document.getElementById('loginForm').classList.add('d-none');
    document.getElementById('groupPicker').classList.remove('d-none');
    const roleColor = {admin:'danger', treasurer:'warning', member:'secondary'};
    document.getElementById('groupList').innerHTML = memberships.map(m => `
        <button class="btn btn-outline-success w-100 mb-2 text-start fw-normal"
                onclick="selectGroup(${m.group_id}, '${m.role}')">
            <i class="fas fa-users me-2"></i>
            <strong>${m.group_name}</strong>
            <span class="badge bg-${roleColor[m.role]||'secondary'} ms-2 float-end">${m.role}</span>
        </button>
    `).join('');
}

function selectGroup(groupId, role) {
    document.cookie = `sb-group-id=${groupId}; path=/; SameSite=Lax`;
    redirectByRole(role);
}

async function handleSupabaseLogin() {
    if (!sb) {
        return showError('Quick login not configured. Please use Password Login tab.');
    }
    const password = document.getElementById('sbPassword').value;
    if (!password) return showError('Password is required.');

    const btn = document.getElementById('sbLoginBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border me-2"></span>Signing in...';
    clearAlerts();

    let result;
    if (identifierMode === 'phone') {
        const phone = document.getElementById('sbPhone').value.trim();
        if (!phone) {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt me-1"></i> Login';
            return showError('Phone number is required.');
        }
        result = await sb.auth.signInWithPassword({ phone, password });
    } else {
        const email = document.getElementById('sbEmail').value.trim();
        if (!email) {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt me-1"></i> Login';
            return showError('Email address is required.');
        }
        result = await sb.auth.signInWithPassword({ email, password });
    }

    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-sign-in-alt me-1"></i> Login';

    if (result.error) {
        return showError(result.error.message || 'Login failed. Check your credentials.');
    }

    const token = result.data.session.access_token;
    document.cookie = `sb-access-token=${token}; path=/; SameSite=Lax`;
    document.cookie = `sb-refresh-token=${result.data.session.refresh_token}; path=/; SameSite=Lax`;

    // Fetch memberships
    let memberRes;
    try {
        memberRes = await fetch('/api/auth/memberships', {
            headers: { 'Authorization': `Bearer ${token}` }
        });
    } catch(e) {
        return showError('Network error. Please try Password Login instead.');
    }

    if (!memberRes.ok) {
        return showError('Could not retrieve group memberships. Try Password Login.');
    }
    const data = await memberRes.json();

    if (!data.memberships || data.memberships.length === 0) {
        return showError('No Kikoba membership found. Try Password Login with your Group ID.');
    }

    if (data.memberships.length === 1) {
        const m = data.memberships[0];
        document.cookie = `sb-group-id=${m.group_id}; path=/; SameSite=Lax`;
        redirectByRole(m.role);
    } else {
        showGroupPicker(data.memberships);
    }
}

// Check for existing Supabase session ONCE — don't loop
// Only auto-redirect if we also have a valid Flask session
(async () => {
    if (!sb) return;
    // If Flask already has a session (cookie), just go straight to dashboard
    // Don't auto-redirect from Supabase session — it causes infinite loops
    // The user must click login
})();
</script>
</body>
</html>
