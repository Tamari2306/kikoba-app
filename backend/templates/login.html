<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Kikoba App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body{background:linear-gradient(135deg,#198754 0%,#0d6efd 100%);min-height:100vh;display:flex;align-items:center;}
        .card{border:none;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.22);}
        .card-header{background:linear-gradient(135deg,#198754 0%,#0d6efd 100%);border-radius:16px 16px 0 0!important;}
        .btn-primary{background:#198754;border-color:#198754;}
        .btn-primary:hover{background:#157347;border-color:#157347;}
        .btn-outline-success{color:#198754;border-color:#198754;}
        .btn-outline-success.active,.btn-outline-success:hover{background:#198754;color:#fff;border-color:#198754;}
        .toggle-pw{border:1px solid #ced4da;border-left:none;background:#fff;color:#6c757d;}
        .group-btn{transition:.15s;}
        .group-btn:hover{background:#e8f5e9;border-color:#198754;}
        .spinner-border{width:1.1rem;height:1.1rem;border-width:2px;}
    </style>
</head>
<body>
<div class="container py-4">
<div class="row justify-content-center">
<div class="col-md-5 col-lg-4">

    <div class="card">
        <div class="card-header text-center py-4">
            <i class="fas fa-leaf fa-2x text-white mb-2 d-block"></i>
            <h4 class="text-white fw-bold mb-0">Kikoba App</h4>
            <small class="text-white opacity-75">Sign in to your account</small>
        </div>
        <div class="card-body p-4">

            {%- if error %}
            <div class="alert alert-danger py-2 mb-3">
                <i class="fas fa-exclamation-circle me-1"></i> {{ error }}
            </div>
            {%- endif %}

            {%- if show_picker %}
            <!-- SERVER-SIDE GROUP PICKER (no JS needed) -->
            <p class="text-muted small mb-3">
                <i class="fas fa-users me-1"></i>
                You belong to multiple Vikoba. Choose one:
            </p>
            <form method="POST" action="/login">
                <input type="hidden" name="identifier" value="{{ identifier }}">
                <input type="hidden" name="password"   value="{{ password }}">
                {%- for g in picker_groups %}
                <button type="submit" name="group_id" value="{{ g.group_id }}"
                        class="btn btn-outline-success group-btn w-100 text-start mb-2 px-3 py-2">
                    <i class="fas fa-users me-2"></i>
                    <strong>{{ g.group_name }}</strong>
                    <span class="badge bg-{{ 'danger' if g.role=='admin' else 'warning' if g.role=='treasurer' else 'secondary' }} float-end mt-1">
                        {{ g.role }}
                    </span>
                </button>
                {%- endfor %}
            </form>
            <hr>
            <a href="/login" class="btn btn-sm btn-outline-secondary w-100">
                <i class="fas fa-arrow-left me-1"></i> Back
            </a>

            {%- else %}
            <!-- LOGIN FORM -->
            <form id="loginForm" method="POST" action="/login">
                <input type="hidden" name="group_id" id="hiddenGroupId">

                <div class="mb-3">
                    <label class="form-label fw-bold">Phone or Email</label>
                    <input type="text" name="identifier" id="identifier"
                           class="form-control" placeholder="0712345678 or you@email.com"
                           required autocomplete="username">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Password</label>
                    <div class="input-group">
                        <input type="password" name="password" id="pw"
                               class="form-control" placeholder="Your password"
                               required autocomplete="current-password">
                        <button class="toggle-pw btn" type="button" onclick="togglePw()">
                            <i class="fas fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>
                <div class="text-end mb-3">
                    <a href="/forgot-password" class="small text-decoration-none" style="color:#198754">
                        Forgot password?
                    </a>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold btn-lg" id="loginBtn">
                    <i class="fas fa-sign-in-alt me-1"></i> Login
                </button>
            </form>

            <!-- JS GROUP PICKER (shown after Supabase login) -->
            <div id="jsPicker" class="d-none mt-3">
                <hr>
                <p class="text-muted small mb-2">
                    <i class="fas fa-users me-1"></i> Choose your Kikoba:
                </p>
                <div id="jsGroupList"></div>
                <button class="btn btn-sm btn-outline-secondary w-100 mt-2"
                        onclick="showForm()">
                    <i class="fas fa-arrow-left me-1"></i> Back
                </button>
            </div>
            {%- endif %}

            <div class="text-center mt-3">
                <small class="text-muted">New admin?
                    <a href="/signup" class="text-decoration-none" style="color:#198754">
                        Create account →
                    </a>
                </small>
            </div>
        </div>
    </div>

</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL  = "{{ supabase_url }}";
const SB_ANON = "{{ supabase_anon }}";
const sbOk    = SB_URL && SB_URL !== "None" && SB_URL !== "";
const sb      = sbOk ? supabase.createClient(SB_URL, SB_ANON) : null;

function togglePw() {
    const pw   = document.getElementById('pw');
    const icon = document.getElementById('eyeIcon');
    pw.type    = pw.type === 'password' ? 'text' : 'password';
    icon.classList.toggle('fa-eye');
    icon.classList.toggle('fa-eye-slash');
}

function showForm() {
    document.getElementById('jsPicker').classList.add('d-none');
    document.getElementById('loginForm').classList.remove('d-none');
}

const roleColor = {admin:'danger',treasurer:'warning text-dark',member:'secondary'};

function showJsPicker(groups) {
    document.getElementById('loginForm').classList.add('d-none');
    const list = document.getElementById('jsGroupList');
    list.innerHTML = groups.map(g => `
        <button class="btn btn-outline-success group-btn w-100 text-start mb-2 px-3 py-2"
                onclick="pickGroup(${g.group_id}, '${g.role}', '${g.name}')">
            <i class="fas fa-users me-2"></i>
            <strong>${g.group_name}</strong>
            <span class="badge bg-${roleColor[g.role]||'secondary'} float-end mt-1">${g.role}</span>
        </button>`).join('');
    document.getElementById('jsPicker').classList.remove('d-none');
}

async function pickGroup(groupId, role, name) {
    const token = (await sb.auth.getSession()).data?.session?.access_token;
    if (!token) return location.href = '/login';

    const res  = await fetch('/api/auth/set-session', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({token, group_id: groupId})
    });
    const data = await res.json();
    if (data.redirect) {
        window.location.href = data.redirect;
    } else {
        location.href = role === 'admin' || role === 'treasurer' ? '/dashboard' : '/member-portal';
    }
}

// Intercept form submit: try Supabase first, fall back to form POST
document.getElementById('loginForm')?.addEventListener('submit', async function(e) {
    if (!sb) return; // No Supabase config — let form POST handle it

    e.preventDefault();
    const identifier = document.getElementById('identifier').value.trim();
    const password   = document.getElementById('pw').value;
    const btn        = document.getElementById('loginBtn');

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border me-2"></span>Signing in...';

    // Determine if phone or email
    const isPhone  = /^[\+0-9]{7,15}$/.test(identifier.replace(/\s/g,''));
    const loginObj = isPhone
        ? {phone: identifier.startsWith('+') ? identifier : '+255' + identifier.replace(/^0/,''), password}
        : {email: identifier, password};

    const {data, error} = await sb.auth.signInWithPassword(loginObj);

    if (error) {
        // Supabase failed — fall back to form POST (server-side session login)
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt me-1"></i> Login';
        this.submit(); // submit form normally
        return;
    }

    const token = data.session.access_token;

    // Call set-session to get memberships + set Flask session
    const res  = await fetch('/api/auth/set-session', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({token})
    });
    const result = await res.json();

    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-sign-in-alt me-1"></i> Login';

    if (!res.ok || result.error) {
        // No membership via Supabase — try form POST fallback
        this.submit();
        return;
    }

    if (result.status === 'session_set') {
        window.location.href = result.redirect;
    } else if (result.groups && result.groups.length === 1) {
        await pickGroup(result.groups[0].group_id, result.groups[0].role, result.groups[0].name);
    } else if (result.groups && result.groups.length > 1) {
        showJsPicker(result.groups);
    } else {
        this.submit(); // fallback
    }
});
</script>
</body>
</html>
