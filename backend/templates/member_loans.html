{% extends "member_base.html" %}
{% block content %}
<h4 class="fw-bold mb-4"><i class="fas fa-money-bill-wave me-2 text-warning"></i>Group Loans</h4>
<div class="card border-0 shadow-sm">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-warning">
                    <tr><th>Member</th><th>Start</th><th class="text-end">Principal</th>
                        <th class="text-end">Monthly</th><th class="text-end">Repaid</th>
                        <th class="text-end">Remaining</th><th>Due</th><th>Status</th></tr>
                </thead>
                <tbody id="loansTable">
                    <tr><td colspan="8" class="text-center text-muted py-3">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script>
function fc(n){const v=parseFloat(n);return isNaN(v)?'0 TZS':v.toLocaleString('en-TZ',{maximumFractionDigits:0})+' TZS';}
const sc={Active:'success',Overdue:'danger',Cleared:'secondary',Forgiven:'info'};
async function load(){
    const res = await fetch('/api/loans');
    if(!res.ok) return;
    const loans = await res.json();
    document.getElementById('loansTable').innerHTML = loans.length
        ? loans.map(l=>`<tr>
            <td class="fw-bold">${l.member_name||'—'}</td>
            <td>${l.start_date||'—'}</td>
            <td class="text-end">${fc(l.principal)}</td>
            <td class="text-end text-info">${fc(l.monthly_rejesho)}</td>
            <td class="text-end text-success">${fc(l.amount_returned)}</td>
            <td class="text-end ${parseFloat(l.remaining)>0?'text-danger fw-bold':'text-success'}">${fc(l.remaining)}</td>
            <td>${l.due_date||'—'}</td>
            <td><span class="badge bg-${sc[l.status]||'secondary'}">${l.status}</span></td>
          </tr>`).join('')
        : '<tr><td colspan="8" class="text-center text-muted">No loans</td></tr>';
}
document.addEventListener('DOMContentLoaded',load);
</script>
{% endblock %}
