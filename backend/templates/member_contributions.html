{% extends "member_base.html" %}
{% block content %}
<h4 class="fw-bold mb-4"><i class="fas fa-hand-holding-usd me-2 text-success"></i>Group Contributions</h4>
<div class="card border-0 shadow-sm">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-success">
                    <tr><th>Date</th><th>Member</th><th>Type</th><th class="text-end">Amount</th></tr>
                </thead>
                <tbody id="contribTable">
                    <tr><td colspan="4" class="text-center text-muted py-3">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script>
function fc(n){const v=parseFloat(n);return isNaN(v)?'0 TZS':v.toLocaleString('en-TZ',{maximumFractionDigits:0})+' TZS';}
const typeColor={hisa:'primary','hisa anzia':'success',jamii:'info',rejesho:'warning',penalty_payment:'danger'};
async function load(){
    const res = await fetch('/api/contributions');
    if(!res.ok) return;
    const data = await res.json();
    const rows = data.ledger||data||[];
    document.getElementById('contribTable').innerHTML = rows.length
        ? rows.map(c=>`<tr>
            <td>${c.date||'—'}</td>
            <td class="fw-bold">${c.member_name||'—'}</td>
            <td><span class="badge bg-${typeColor[c.type]||'secondary'}">${c.type}</span></td>
            <td class="text-end fw-bold">${fc(c.amount)}</td>
          </tr>`).join('')
        : '<tr><td colspan="4" class="text-center text-muted">No contributions yet</td></tr>';
}
document.addEventListener('DOMContentLoaded',load);
</script>
{% endblock %}
