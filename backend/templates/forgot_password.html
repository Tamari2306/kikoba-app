<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - Kikoba App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #198754 0%, #0d6efd 100%); min-height: 100vh; display: flex; align-items: center; }
        .card { border: none; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .card-header { background: linear-gradient(135deg, #198754 0%, #0d6efd 100%); border-radius: 16px 16px 0 0 !important; }
        .btn-primary { background: #198754; border-color: #198754; }
        .btn-primary:hover { background: #157347; border-color: #157347; }
        .toggle-pw { cursor: pointer; background: none; border: 1px solid #ced4da; border-left: none; color: #6c757d; }
</style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card">
                <div class="card-header text-center py-4">
                    <i class="fas fa-key fa-2x text-white mb-2"></i>
                    <h4 class="text-white fw-bold mb-0">Forgot Password</h4>
                    <small class="text-white opacity-75">Kikoba App</small>
                </div>
                <div class="card-body p-4">
                    {% if error %}
                    <div class="alert alert-danger py-2">
                        <i class="fas fa-exclamation-circle me-1"></i> {{ error }}
                    </div>
                    {% endif %}
                    {% if success %}
                    <div class="alert alert-success py-2">
                        <i class="fas fa-check-circle me-1"></i> {{ success }}
                    </div>
                    {% else %}
                    <p class="text-muted mb-4">Enter your registered email address and we'll send you a password reset link.</p>
                    <form method="POST" action="/forgot-password">
                        <div class="mb-4">
                            <label class="form-label fw-bold">Email Address</label>
                            <input type="email" name="email" class="form-control form-control-lg"
                                   placeholder="your@email.com" required autofocus>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold btn-lg">
                            <i class="fas fa-paper-plane me-1"></i> Send Reset Link
                        </button>
                    </form>
                    {% endif %}
                    <div class="text-center mt-3">
                        <a href="/login" class="text-decoration-none text-muted">
                            <i class="fas fa-arrow-left me-1"></i> Back to Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
