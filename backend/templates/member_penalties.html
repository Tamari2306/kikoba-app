{% extends "member_base.html" %}
{% block content %}
<h4 class="fw-bold mb-4"><i class="fas fa-exclamation-triangle me-2 text-danger"></i>Group Penalties</h4>
<div class="card border-0 shadow-sm">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-danger">
                    <tr><th>Member</th><th>Date</th><th>Type</th>
                        <th class="text-end">Amount</th><th class="text-end">Paid</th>
                        <th class="text-end">Remaining</th><th>Status</th><th>Description</th></tr>
                </thead>
                <tbody id="penaltiesTable">
                    <tr><td colspan="8" class="text-center text-muted py-3">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script>
function fc(n){const v=parseFloat(n);return isNaN(v)?'0 TZS':v.toLocaleString('en-TZ',{maximumFractionDigits:0})+' TZS';}
async function load(){
    const res = await fetch('/api/penalties');
    if(!res.ok) return;
    const data = await res.json();
    const rows = data.ledger||[];
    document.getElementById('penaltiesTable').innerHTML = rows.length
        ? rows.map(p=>{
            const fg = parseFloat(p.forgiven_amount||0);
            const rem = Math.max(0,parseFloat(p.amount||0)-parseFloat(p.amount_paid||0)-fg);
            const frozen = p.is_frozen===1||p.is_frozen===true;
            const status = frozen?'<span class="badge bg-info">Frozen</span>':
                           rem<=0?'<span class="badge bg-success">Cleared</span>':
                           '<span class="badge bg-warning text-dark">Pending</span>';
            return `<tr>
                <td class="fw-bold">${p.member_name||'—'}</td>
                <td>${p.date||'—'}</td>
                <td>${p.type==='monthly_rejesho_late'?'<span class="badge bg-danger">Auto</span>':'<span class="badge bg-secondary">Manual</span>'}</td>
                <td class="text-end">${fc(p.amount)}</td>
                <td class="text-end text-success">${fc(p.amount_paid)}</td>
                <td class="text-end ${rem>0?'text-danger fw-bold':'text-success'}">${fc(rem)}</td>
                <td>${status}</td>
                <td><small>${p.description||'—'}</small></td>
              </tr>`;
          }).join('')
        : '<tr><td colspan="8" class="text-center text-muted">No penalties</td></tr>';
}
document.addEventListener('DOMContentLoaded',load);
</script>
{% endblock %}
